name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EASYNFP_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, static analysis and tests
        run: ./gradlew --continue --stacktrace check assembleDebug

      - name: Room schema files are committed (N-07)
        if: always()
        run: |
          git status --porcelain data/schemas
          if [ -n "$(git status --porcelain data/schemas)" ]; then
            echo "::error::Room schema changed but the schema file is not committed. Commit data/schemas."
            find data/schemas -name '*.json' -print -exec cat {} \;
            exit 1
          fi

      - name: No network permission in the APK (N-01)
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/aapt2
          "$AAPT2" dump permissions "$APK" | tee permissions.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "::error::The APK requests INTERNET."
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: easyNFP-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_number }}
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore

  release:
    name: Signed release APK
    needs: build
    # Tags v* publish a GitHub release; main and manual runs only upload the APK as artifact.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      EASYNFP_VERSION_CODE: ${{ github.run_number }}
      KEYSTORE_BASE64: ${{ secrets.EASYNFP_KEYSTORE_BASE64 }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key is required for releases
        if: env.IS_TAG == 'true' && env.KEYSTORE_BASE64 == ''
        run: |
          echo "::error::No signing key configured (see docs/build-and-release.md). Cannot publish a release."
          exit 1

      - name: Version name from tag
        if: env.IS_TAG == 'true'
        run: echo "EASYNFP_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.KEYSTORE_BASE64 != ''
        env:
          EASYNFP_KEYSTORE_FILE: release.keystore
          EASYNFP_KEYSTORE_PASSWORD: ${{ secrets.EASYNFP_KEYSTORE_PASSWORD }}
          EASYNFP_KEY_ALIAS: ${{ secrets.EASYNFP_KEY_ALIAS }}
          EASYNFP_KEY_PASSWORD: ${{ secrets.EASYNFP_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          ./gradlew --stacktrace assembleRelease
          rm release.keystore

      - name: Skip without signing key
        if: env.KEYSTORE_BASE64 == ''
        run: echo "::notice::No signing key configured (see docs/build-and-release.md). Only the debug APK is built."

      - name: Upload release APK
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: easyNFP-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk

      # Fixed asset name, so .../releases/latest/download/easyNFP.apk always points to the newest version.
      - name: Publish GitHub release
        if: env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk dist/easyNFP.apk
          (cd dist && sha256sum easyNFP.apk > easyNFP.apk.sha256)
          cat > notes.md <<EOF
          **Installation:** \`easyNFP.apk\` unten herunterladen und auf dem Handy öffnen.
          Schritt für Schritt: [Anleitung](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/installation.md).
          Updates einfach über die vorhandene App installieren – nicht vorher deinstallieren, sonst sind die Daten weg.

          > easyNFP ist ein privates Hobbyprojekt, kein Medizinprodukt und nicht zur Verhütung bestimmt.
          > Nutzung ohne Gewährleistung (GPL-3.0, Abschnitte 15 und 16).

          EOF
          gh release create "$GITHUB_REF_NAME" dist/easyNFP.apk dist/easyNFP.apk.sha256 \
            --title "easyNFP $EASYNFP_VERSION_NAME" --notes-file notes.md --generate-notes --verify-tag
