name: CI

# Branches get CI through their pull request, so a PR is not built twice (push + pull_request).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EASYNFP_VERSION_CODE: ${{ github.run_number }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
      # The signed release APK is only built for tags v* and manual runs, in the same Gradle call as the checks.
      WANTS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare release signing
        id: signing
        if: env.WANTS_RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.EASYNFP_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$IS_TAG" = true ]; then
              echo "::error::No signing key configured (see docs/build-and-release.md). Cannot publish a release."
              exit 1
            fi
            echo "::notice::No signing key configured (see docs/build-and-release.md). Only the debug APK is built."
            exit 0
          fi
          # RUNNER_TEMP is outside the workspace and wiped after the job.
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "EASYNFP_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "release=true" >> "$GITHUB_OUTPUT"
          if [ "$IS_TAG" = true ]; then
            echo "EASYNFP_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Build, static analysis and tests
        env:
          EASYNFP_KEYSTORE_PASSWORD: ${{ env.WANTS_RELEASE == 'true' && secrets.EASYNFP_KEYSTORE_PASSWORD || '' }}
          EASYNFP_KEY_ALIAS: ${{ env.WANTS_RELEASE == 'true' && secrets.EASYNFP_KEY_ALIAS || '' }}
          EASYNFP_KEY_PASSWORD: ${{ env.WANTS_RELEASE == 'true' && secrets.EASYNFP_KEY_PASSWORD || '' }}
        run: >-
          ./gradlew --continue --stacktrace check assembleDebug
          ${{ steps.signing.outputs.release == 'true' && 'assembleRelease' || '' }}

      - name: Room schema files are committed (N-07)
        if: always()
        run: |
          git status --porcelain data/schemas
          if [ -n "$(git status --porcelain data/schemas)" ]; then
            echo "::error::Room schema changed but the schema file is not committed. Commit data/schemas."
            find data/schemas -name '*.json' -print -exec cat {} \;
            exit 1
          fi

      - name: No network permission in the APKs (N-01)
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/aapt2
          for APK in app/build/outputs/apk/*/*.apk; do
            echo "== $APK"
            "$AAPT2" dump permissions "$APK" | tee permissions.txt
            if grep -q "android.permission.INTERNET" permissions.txt; then
              echo "::error::$APK requests INTERNET."
              exit 1
            fi
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: easyNFP-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        if: steps.signing.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: easyNFP-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_number }}
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore

  # Only this small job (no build, no secrets) may write to the repository.
  publish:
    name: Publish GitHub release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: easyNFP-release-${{ github.run_number }}
          path: apk

      # Fixed asset name, so .../releases/latest/download/easyNFP.apk always points to the newest version.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir dist
          cp apk/app-release.apk dist/easyNFP.apk
          (cd dist && sha256sum easyNFP.apk > easyNFP.apk.sha256)
          cat > notes.md <<EOF
          **Installation:** \`easyNFP.apk\` unten herunterladen und auf dem Handy öffnen.
          Schritt für Schritt: [Anleitung](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/installation.md).
          Updates einfach über die vorhandene App installieren – nicht vorher deinstallieren, sonst sind die Daten weg.

          > easyNFP ist ein privates Hobbyprojekt, kein Medizinprodukt und nicht zur Verhütung bestimmt.
          > Nutzung ohne Gewährleistung (GPL-3.0, Abschnitte 15 und 16).

          EOF
          gh release create "$GITHUB_REF_NAME" dist/easyNFP.apk dist/easyNFP.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "easyNFP $VERSION" \
            --notes-file notes.md --generate-notes --verify-tag
