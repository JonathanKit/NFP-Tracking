# Overrides on top of the detekt default configuration (buildUponDefaultConfig = true).
build:
  maxIssues: 0

complexity:
  LongMethod:
    threshold: 80
    ignoreAnnotated: ['Composable']
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
    ignoreAnnotated: ['Composable']
    ignoreDefaultParameters: true
  CyclomaticComplexMethod:
    threshold: 20
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    thresholdInFiles: 30
    thresholdInClasses: 30
    thresholdInObjects: 20
    thresholdInInterfaces: 20
    ignorePrivate: true
  NestedBlockDepth:
    threshold: 5

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'
  MatchingDeclarationName:
    active: false

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated: ['Composable', 'Preview']
    # Drawing and layout code is full of dimensions; naming each would hurt readability.
    excludes: ['**/test/**', '**/androidTest/**', '**/ui/**', '**/export/**', '**/widget/**']
  ReturnCount:
    max: 5
    excludeGuardClauses: true
  MaxLineLength:
    maxLineLength: 120
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  ForbiddenComment:
    active: false
  WildcardImport:
    excludes: ['**/test/**']
  DestructuringDeclarationWithTooManyEntries:
    maxDestructuringEntries: 4
  ThrowsCount:
    max: 6

performance:
  SpreadOperator:
    active: false
  ForEachOnRange:
    active: false

exceptions:
  SwallowedException:
    ignoredExceptionTypes:
      - 'InterruptedException'
      - 'MalformedURLException'
      - 'NumberFormatException'
      - 'ParseException'
      - 'IOException'
      - 'SecurityException'
      - 'DateTimeParseException'
      - 'GeneralSecurityException'
